# -----------------------------------------------------------------------------
# docker-compose.yml
#
# Orchestrates all four ReferrAI services for local development. Startup order
# is enforced via health checks: db healthy → backend healthy (runs alembic
# upgrade head on start) → nginx. The frontend_node_modules named volume
# prevents the ./frontend bind-mount from shadowing the container's node_modules.
# All four services expose ports directly (5432, 8000, 3000, 80) for debugging;
# in a production deployment remove direct port exposure except 80.
# Usage: `docker compose up --build` from the repo root. See .env.example.
# -----------------------------------------------------------------------------

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"           # exposed for local tools (TablePlus, psql, etc.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DATABASE_URL so the hostname is the compose service name "db"
      DATABASE_URL: ${DATABASE_URL}
      # Dev/demo only: create this admin on startup if missing (public sign-up
      # only creates partners). Remove or change for anything real.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@referrai.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
    volumes:
      - ./backend:/app              # hot-reload: code changes reflected immediately
      - model_data:/models          # trained AI models
    ports:
      - "8000:8000"                 # direct access during development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s             # allow time for alembic upgrade head

  # ── React / Vite dev server ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app             # hot-reload: source changes trigger HMR
      - frontend_node_modules:/app/node_modules   # keep container node_modules
    ports:
      - "3000:3000"                 # direct access during development
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',(r)=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  model_data:           # trained AI models (survive rebuilds)
  postgres_data:        # persists DB data across container restarts
  frontend_node_modules: # isolates node_modules from host bind-mount
