# -----------------------------------------------------------------------------
# backend/alembic.ini
#
# Alembic configuration file — read by all `alembic` CLI commands run from the
# backend/ directory. script_location points to the alembic/ package directory.
# The timestamp-prefixed file_template prevents migration filename collisions on
# parallel feature branches. Default sqlalchemy.url is SQLite for local dev and
# CI; alembic/env.py overrides it with the DATABASE_URL env var at runtime.
# To apply migrations: `alembic upgrade head` (from backend/).
# To generate a new migration: `alembic revision --autogenerate -m "description"`.
# -----------------------------------------------------------------------------

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# Default URL for local dev/testing with SQLite.
# Production overrides this via the DATABASE_URL environment variable (see env.py).
sqlalchemy.url = sqlite:///./referrai_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
