<!-- ---------------------------------------------------------------------------
  frontend/index.html

  Single-page app shell. React mounts into #root (src/main.jsx); every route
  is client-side, so the web server must serve this file for all paths.
  The inline script applies the saved light/dark theme before first paint
  to avoid a flash of the wrong theme.
--------------------------------------------------------------------------- -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ReferrAI — referral and commission management" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ReferrAI</title>
    <script>
      try {
        var t = localStorage.getItem('referrai-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
