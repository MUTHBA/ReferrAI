# -----------------------------------------------------------------------------
# frontend/nginx.prod.conf
#
# Nginx config for the production frontend container (DEMO-002). This file is
# copied into the Docker image during the multi-stage build (Dockerfile.prod).
# Routes:
#   /api/*       → FastAPI backend:8000 (proxied, preserves Host header)
#   /health      → backend health endpoint (used by upstream monitors)
#   /r/*         → backend public referral redirect endpoint
#   *.js|*.css…  → static assets from the React build, cached 1 year immutable
#   /            → SPA fallback: always returns index.html for React Router
# Gzip is enabled for JS/CSS/JSON/SVG to reduce transfer size.
# No WebSocket proxying needed — Vite HMR is not used in production.
# -----------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip            on;
    gzip_types      text/css application/javascript application/json
                    text/javascript image/svg+xml text/plain;
    gzip_min_length 1024;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # FastAPI API endpoints
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check (used by load balancers / uptime monitors)
        location /health {
            proxy_pass         http://backend/health;
            proxy_set_header   Host              $host;
        }

        # Public referral click-tracking redirect
        location /r/ {
            proxy_pass         http://backend/r/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Hashed static assets — safe to cache indefinitely
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires           1y;
            add_header        Cache-Control "public, immutable";
        }

        # SPA fallback — React Router handles client-side navigation
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
