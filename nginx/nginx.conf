# -----------------------------------------------------------------------------
# nginx/nginx.conf
#
# nginx reverse proxy that sits in front of both services on port 80. Routes:
# /api/* → FastAPI backend:8000, / → Vite dev server frontend:3000.
# The map block (inside http) derives $connection_upgrade for WebSocket proxying,
# which is required for Vite HMR (hot-module replacement) to work through nginx.
# Timeouts are set to 3600s to keep HMR WebSocket connections alive.
# Developers: the /health, /docs, and /redoc paths also proxy to the backend
# so Swagger UI is accessible at http://localhost/docs during development.
# -----------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Required for WebSocket proxying (Vite HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Increase timeouts for WebSocket keep-alive and long-polling
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # API requests → FastAPI
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # Backend health endpoint and Swagger UI
        location ~ ^/(health|docs|redoc|openapi\.json) {
            proxy_pass       http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Everything else → Vite dev server (with WebSocket upgrade for HMR)
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
